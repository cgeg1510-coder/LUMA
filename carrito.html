<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMA | Carrito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg luma-nav sticky-top">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">
            LUMA
        </a>


        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="categorias.html">
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="vender.html">
                        Vender
                    </a>
                </li>

            </ul>


            <a href="carrito.html" class="cart-link">

                🛒

                <span id="cartCount" class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</nav>


<main class="container section">


    <div class="page-heading">

        <span class="eyebrow">
            TU COMPRA
        </span>

        <h1>
            Tu carrito
        </h1>

    </div>


    <div class="cart-layout">


        <div id="cartItems" class="cart-items"></div>


        <aside class="order-summary">

            <h3>
                Resumen del pedido
            </h3>


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    $0
                </strong>

            </div>


            <div class="summary-line">

                <span>
                    Envío
                </span>

                <strong id="shipping">
                    $0
                </strong>

            </div>


            <hr>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="total">
                    $0
                </strong>

            </div>


            <button
                class="btn-luma w-100 mt-3"
                onclick="checkout()">

                Continuar con el pago

            </button>

        </aside>


    </div>

</main>


<footer>

    <div class="container">

        <strong>LUMA</strong>

        <span>
            Compra. Vende. Viste diferente.
        </span>

    </div>

</footer>


<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
