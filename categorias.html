<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMA | Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<nav class="navbar navbar-expand-lg luma-nav sticky-top">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">
            LUMA
        </a>


        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="categorias.html">
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="vender.html">
                        Vender
                    </a>
                </li>

            </ul>


            <a href="carrito.html" class="cart-link">

                🛒

                <span id="cartCount" class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</nav>


<main class="container section">


    <div class="page-heading">

        <span class="eyebrow">
            EXPLORA LUMA
        </span>

        <h1>
            Categorías
        </h1>

        <p>
            Encuentra lo que buscas entre productos nuevos y usados.
        </p>

    </div>


    <!-- CATEGORIAS -->

    <div class="category-grid">

        <button onclick="filterCategory('Ropa')">
            👕
            <span>Ropa</span>
        </button>


        <button onclick="filterCategory('Tenis')">
            👟
            <span>Tenis y zapatos</span>
        </button>


        <button onclick="filterCategory('Accesorios')">
            🧢
            <span>Accesorios</span>
        </button>


        <button onclick="filterCategory('Bolsas')">
            👜
            <span>Bolsas</span>
        </button>


        <button onclick="filterCategory('Nuevo')">
            ✦
            <span>Ropa nueva</span>
        </button>


        <button onclick="filterCategory('Usado')">
            ↻
            <span>Ropa usada</span>
        </button>

    </div>


    <!-- BUSCADOR -->

    <div class="products-header">

        <h2 id="categoryTitle">
            Todos los productos
        </h2>


        <input
            id="searchProducts"
            class="search-input"
            type="search"
            placeholder="Buscar productos..."
            oninput="renderCategoryProducts()"
        >

    </div>


    <!-- PRODUCTOS -->

    <div id="categoryProducts" class="row g-4"></div>


</main>


<footer>

    <div class="container">

        <strong>LUMA</strong>

        <span>
            Compra. Vende. Viste diferente.
        </span>

    </div>

</footer>


<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
