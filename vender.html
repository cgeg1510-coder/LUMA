<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMA | Vender</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg luma-nav sticky-top">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">
            LUMA
        </a>


        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="categorias.html">
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="vender.html">
                        Vender
                    </a>
                </li>

            </ul>


            <a href="carrito.html" class="cart-link">

                🛒

                <span id="cartCount" class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</nav>


<main class="container section">


    <div class="page-heading">

        <span class="eyebrow">
            VENDE EN LUMA
        </span>

        <h1>
            Publica tu producto
        </h1>

        <p>
            Dale una segunda vida a lo que ya no usas
            o vende algo nuevo.
        </p>

    </div>


    <form id="sellForm" class="sell-form">


        <!-- FOTO -->

        <div class="upload-box">

            <div class="upload-icon">
                ＋
            </div>

            <h3>
                Sube una foto
            </h3>

            <p>
                Selecciona una imagen de tu producto.
            </p>


            <input
                id="productImage"
                type="file"
                accept="image/*"
                class="form-control"
            >


            <img
                id="imagePreview"
                class="image-preview"
                alt="Vista previa"
            >

        </div>


        <!-- INFORMACION -->

        <div class="form-fields">


            <label>

                Nombre del producto

                <input
                    id="productName"
                    required
                    placeholder="Ej. Nike Air Force 1"
                >

            </label>


            <label>

                Precio (MXN)

                <input
                    id="productPrice"
                    type="number"
                    min="1"
                    required
                    placeholder="Ej. 1500"
                >

            </label>


            <label>

                Categoría

                <select id="productCategory" required>

                    <option value="">
                        Selecciona una categoría
                    </option>

                    <option>
                        Ropa
                    </option>

                    <option>
                        Tenis
                    </option>

                    <option>
                        Accesorios
                    </option>

                    <option>
                        Bolsas
                    </option>

                </select>

            </label>


            <label>
                Estado del producto
            </label>


            <div class="condition">

                <label>
                    <input
                        type="radio"
                        name="condition"
                        value="Nuevo"
                        checked
                    >
                    Nuevo
                </label>


                <label>
                    <input
                        type="radio"
                        name="condition"
                        value="Usado"
                    >
                    Usado
                </label>

            </div>


            <label>

                Descripción

                <textarea
                    id="productDescription"
                    maxlength="500"
                    placeholder="Cuéntanos más sobre el producto"
                ></textarea>

            </label>


            <button
                class="btn-luma"
                type="submit">

                Publicar producto

            </button>


        </div>

    </form>

</main>


<footer>

    <div class="container">

        <strong>LUMA</strong>

        <span>
            Compra. Vende. Viste diferente.
        </span>

    </div>

</footer>


<script src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
